<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>STRIKER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080c10;--surface:#0f1620;--surface2:#162030;
  --border:#1e3050;--accent:#00d4ff;--accent2:#ff6b00;
  --red:#ff2244;--green:#00cc66;--gold:#ffcc00;
  --text:#cdd6f4;--muted:#6c7a8e;
}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
canvas{position:fixed;top:0;left:0;display:block;}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,12,16,0.97);}
.screen.active{display:flex;}

/* ── MAIN MENU ── */
#menu{gap:0;}
.menu-bg{position:absolute;inset:0;overflow:hidden;}
.menu-bg canvas{position:absolute;}
.menu-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;}
.game-title{font-size:52px;font-weight:900;letter-spacing:10px;color:#fff;text-shadow:0 0 40px var(--accent),0 0 80px rgba(0,212,255,.3);}
.game-sub{font-size:11px;letter-spacing:6px;color:var(--accent);margin-top:-8px;margin-bottom:8px;}
.menu-btn{padding:12px 36px;font-size:14px;letter-spacing:3px;font-family:inherit;border:none;border-radius:4px;cursor:pointer;transition:all .15s;}
.menu-btn.primary{background:var(--accent);color:#000;font-weight:bold;box-shadow:0 0 20px rgba(0,212,255,.4);}
.menu-btn.primary:hover,.menu-btn.primary:active{background:#fff;box-shadow:0 0 30px rgba(0,212,255,.7);}
.menu-btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
.menu-btn.secondary:hover,.menu-btn.secondary:active{border-color:var(--accent);color:var(--accent);}
.version{font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:8px;}

/* ── CUSTOMIZE SCREEN ── */
#customize{padding:0;background:var(--bg);}
.cust-layout{display:flex;width:100%;max-width:700px;flex-direction:column;gap:0;}
.cust-header{padding:16px 20px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.cust-header h2{font-size:14px;letter-spacing:4px;color:var(--accent);}
.close-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;}

.cust-body{display:flex;gap:0;height:calc(100vh - 110px);overflow:hidden;}
.cust-preview{width:140px;min-width:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-right:1px solid var(--border);padding:16px 8px;}
.preview-canvas-wrap{width:100px;height:120px;position:relative;}
#preview-canvas{width:100px;height:120px;}
.cust-name-input{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:12px;padding:6px 10px;border-radius:4px;width:110px;text-align:center;}
.cust-name-input:focus{outline:none;border-color:var(--accent);}

.cust-options{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:16px;}
.cust-section{display:flex;flex-direction:column;gap:8px;}
.cust-section label{font-size:9px;letter-spacing:3px;color:var(--muted);}
.shape-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.shape-opt{padding:8px 4px;border:1px solid var(--border);border-radius:4px;cursor:pointer;text-align:center;font-size:10px;color:var(--muted);transition:all .12s;}
.shape-opt.sel{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,.08);}
.color-grid{display:flex;flex-wrap:wrap;gap:6px;}
.color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s;}
.color-opt.sel{border-color:#fff;transform:scale(1.15);}
.skin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.skin-opt{padding:8px;border:1px solid var(--border);border-radius:4px;cursor:pointer;text-align:center;font-size:9px;color:var(--muted);transition:all .12s;}
.skin-opt.sel{border-color:var(--accent2);color:var(--accent2);background:rgba(255,107,0,.08);}

.cust-footer{border-top:1px solid var(--border);padding:12px 20px;display:flex;justify-content:flex-end;gap:10px;}
.btn-confirm{padding:10px 28px;background:var(--green);color:#000;font-weight:bold;font-size:13px;letter-spacing:2px;font-family:inherit;border:none;border-radius:4px;cursor:pointer;}

/* ── SHOP SCREEN ── */
#shop{padding:0;background:var(--bg);}
.shop-layout{width:100%;max-width:700px;display:flex;flex-direction:column;height:100vh;}
.shop-header{padding:14px 18px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.shop-header h2{font-size:14px;letter-spacing:4px;color:var(--gold);}
.money-display{font-size:16px;color:var(--gold);letter-spacing:1px;}
.money-display span{font-size:11px;color:var(--muted);}
.shop-tabs{display:flex;border-bottom:1px solid var(--border);}
.shop-tab{flex:1;padding:10px;font-family:inherit;font-size:10px;letter-spacing:2px;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;}
.shop-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.shop-items{flex:1;overflow-y:auto;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.shop-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:all .12s;}
.shop-item:hover{border-color:var(--gold);}
.shop-item.owned{border-color:var(--green);opacity:.7;cursor:default;}
.shop-item.equipped{border-color:var(--accent);background:rgba(0,212,255,.06);}
.shop-item.cant-afford{opacity:.4;cursor:default;}
.item-icon{font-size:26px;text-align:center;}
.item-name{font-size:11px;font-weight:bold;color:#fff;letter-spacing:1px;}
.item-desc{font-size:9px;color:var(--muted);line-height:1.5;}
.item-stats{display:flex;flex-direction:column;gap:2px;}
.item-stat{display:flex;justify-content:space-between;font-size:9px;}
.item-stat .label{color:var(--muted);}
.item-stat .val{color:var(--accent);}
.item-price{font-size:12px;color:var(--gold);font-weight:bold;margin-top:4px;}
.item-price.free{color:var(--green);}
.item-badge{font-size:8px;padding:2px 6px;border-radius:3px;align-self:flex-start;margin-top:2px;}
.badge-owned{background:rgba(0,204,102,.15);color:var(--green);}
.badge-equipped{background:rgba(0,212,255,.15);color:var(--accent);}
.shop-footer{border-top:1px solid var(--border);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;}
.shop-footer .hint{font-size:9px;color:var(--muted);}

/* ── HUD ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;}

/* Top bar */
#top-bar{position:absolute;top:0;left:0;right:0;height:44px;background:linear-gradient(180deg,rgba(8,12,16,.9),transparent);display:flex;align-items:center;justify-content:space-between;padding:8px 14px;}
.hud-money{font-size:13px;color:var(--gold);letter-spacing:1px;}
.hud-money span{font-size:10px;color:var(--muted);}
.hud-wave{font-size:11px;color:var(--muted);letter-spacing:2px;text-align:center;}
.hud-wave b{color:#fff;font-size:14px;}
.hud-score{font-size:13px;color:var(--accent);letter-spacing:1px;text-align:right;}

/* ── BOTTOM-LEFT: HP + Armor bars (compact) ── */
#bar-area{
  position:absolute;bottom:200px;left:10px;
  display:flex;flex-direction:column;gap:4px;
  pointer-events:none;
  width:130px !important;
  max-width:130px !important;
  right:auto !important;
}
.bar-row{display:flex;align-items:center;gap:5px;}
.bar-label{font-size:8px;letter-spacing:1px;color:var(--muted);width:32px;text-align:right;flex-shrink:0;}
.bar-track{width:70px;flex-shrink:0;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .2s;}
#hp-fill{background:linear-gradient(90deg,#ff2244,#ff6644);}
#armor-fill{background:linear-gradient(90deg,#2288ff,#44aaff);}
#hp-txt,#armor-txt{font-size:9px;color:var(--muted);width:20px;flex-shrink:0;text-align:right;}

/* ── BOTTOM-LEFT: Util slots (above bars) ── */
#util-bar{
  position:absolute;bottom:240px;left:10px;
  display:flex;gap:5px;flex-wrap:wrap;max-width:140px;
}
.util-slot{width:36px;height:36px;background:rgba(15,22,32,.85);border:1px solid var(--border);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;pointer-events:all;}
.util-slot .u-icon{font-size:15px;}
.util-slot .u-count{position:absolute;top:1px;right:3px;font-size:8px;color:var(--gold);}
.util-slot .u-cd{position:absolute;inset:0;background:rgba(0,0,0,.65);border-radius:5px;display:none;align-items:center;justify-content:center;font-size:10px;color:#fff;}
.util-slot.active-util{border-color:var(--accent2);}

/* ── BOTTOM-RIGHT: Weapon HUD ── */
#weapon-hud{
  position:absolute;bottom:370px;right:10px;
  text-align:right;
  background:rgba(8,12,16,.75);
  padding:6px 10px;border-radius:6px;
  border:1px solid rgba(255,255,255,.07);
  min-width:110px;max-width:150px;
}
#weapon-name{font-size:10px;color:var(--accent);letter-spacing:2px;margin-bottom:2px;}
#ammo-display{font-size:20px;color:#fff;font-weight:bold;line-height:1;}
#ammo-reserve{font-size:9px;color:var(--muted);}
#reload-bar-wrap{margin-top:3px;display:none;}
#reload-bar-bg{height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
#reload-bar-fill{height:100%;background:var(--accent2);width:0%;border-radius:2px;}
#reload-label{font-size:8px;color:var(--accent2);letter-spacing:1px;margin-top:1px;}
#owned-weapons{margin-top:5px;display:flex;gap:3px;justify-content:flex-end;flex-wrap:wrap;}
#switch-btn{display:none;}

/* Shop btn — mic, lângă money în top bar */
#shop-btn{
  pointer-events:all;
  background:rgba(255,204,0,.12);border:1px solid rgba(255,204,0,.3);
  color:var(--gold);font-family:inherit;font-size:9px;
  letter-spacing:1px;padding:3px 10px;border-radius:3px;cursor:pointer;
}

/* Active effects — sus dreapta, sub top bar ── */
#active-effects{position:absolute;top:48px;right:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;}
.effect-badge{font-size:8px;letter-spacing:1px;padding:2px 7px;border-radius:3px;display:flex;align-items:center;gap:4px;}
.effect-timer{font-size:9px;color:#fff;font-weight:bold;}

/* Kill feed — sus stânga, sub top bar ── */
#feed{position:absolute;top:48px;left:10px;display:flex;flex-direction:column;gap:2px;}
.feed-item{font-size:9px;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:3px;opacity:1;transition:opacity .3s;}

/* Wave announce */
#wave-banner{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;}
#wave-banner h2{font-size:28px;letter-spacing:5px;color:#fff;text-shadow:0 0 30px var(--accent);}
#wave-banner p{font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:4px;}

/* Hit marker */
#hit-marker{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26px;height:26px;opacity:0;pointer-events:none;}
#hit-marker::before,#hit-marker::after{content:'';position:absolute;background:var(--red);}
#hit-marker::before{width:2px;height:10px;top:0;left:12px;}
#hit-marker::after{height:2px;width:10px;top:12px;left:0;}

/* Damage vignette */
#dmg-flash{position:absolute;inset:0;background:rgba(255,20,60,0);transition:background .1s;pointer-events:none;}

/* ── MOBILE CONTROLS ── */
/* Joystick — fix jos-stânga */
#ctrl-left{
  position:fixed;bottom:0;left:0;
  width:180px;height:200px;z-index:6;
}
#joy-base{
  position:absolute;bottom:50px;left:28px;
  width:120px;height:120px;border-radius:50%;
  border:2px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  pointer-events:none;
}
#joy-knob{
  position:absolute;top:50%;left:50%;
  width:50px;height:50px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.18));
  transform:translate(-50%,-50%);
  pointer-events:none;
  box-shadow:0 0 14px rgba(255,255,255,.25);
}

/* Shoot — grande, jos-dreapta, sopra barra browser */
#btn-shoot{
  position:fixed;bottom:80px;right:20px;
  width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,#dd1122,#660008);
  border:3px solid #ff2244;
  box-shadow:0 0 28px rgba(255,34,68,.6);
  font-size:34px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:8;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}

/* Reload — sopra shoot */
#btn-reload{
  position:fixed;bottom:180px;right:30px;
  width:54px;height:54px;border-radius:50%;
  background:rgba(20,50,110,.9);
  border:2px solid #4488cc;
  font-size:22px;color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:8;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
/* Switch weapon */
#btn-switch{
  position:fixed;bottom:244px;right:30px;
  width:54px;height:54px;border-radius:50%;
  background:rgba(0,60,90,.9);
  border:2px solid #00d4ff;
  font-size:20px;color:#00d4ff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:8;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
/* Util */
#btn-util{
  position:fixed;bottom:308px;right:30px;
  width:54px;height:54px;border-radius:50%;
  background:rgba(70,30,0,.9);
  border:2px solid #ff6b00;
  font-size:24px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:8;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}

#ctrl-right{display:none !important;}

/* Game over / between wave */
#between-screen{position:fixed;inset:0;z-index:8;background:rgba(8,12,16,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#between-screen h2{font-size:26px;letter-spacing:5px;color:#fff;}
#between-screen .sub{font-size:11px;color:var(--muted);letter-spacing:3px;}
#between-screen .earned{font-size:18px;color:var(--gold);}
.bw-btn{padding:11px 30px;font-family:inherit;font-size:13px;letter-spacing:3px;border:none;border-radius:4px;cursor:pointer;}
#bw-shop{background:rgba(255,204,0,.15);color:var(--gold);border:1px solid var(--gold);}
#bw-continue{background:var(--accent);color:#000;font-weight:bold;}

/* Scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>

<canvas id="gc"></canvas>

<!-- ── MAIN MENU ── -->
<div id="menu" class="screen active">
  <div class="menu-bg"><canvas id="menu-bg-canvas"></canvas></div>
  <div class="menu-content">
    <div class="game-title">STRIKER</div>
    <div class="game-sub">TACTICAL SHOOTER</div>
    <button class="menu-btn primary" onclick="goCustomize()">▶ NEW GAME</button>
    <button class="menu-btn secondary" onclick="goCustomize()">PERSONALIZARE</button>
    <button class="menu-btn secondary" onclick="openShop()">ARMURĂRIE</button>
    <div class="version">v2.0 · DEMO</div>
  </div>
</div>

<!-- ── CUSTOMIZE SCREEN ── -->
<div id="customize" class="screen">
  <div class="cust-layout">
    <div class="cust-header">
      <h2>PERSONALIZARE PERSONAJ</h2>
      <button class="close-btn" onclick="backToMenu()">✕</button>
    </div>
    <div class="cust-body">
      <div class="cust-preview">
        <canvas id="preview-canvas" width="100" height="120"></canvas>
        <input class="cust-name-input" id="char-name" type="text" maxlength="12" value="STRIKER" placeholder="NUME">
        <div style="font-size:8px;color:var(--muted);letter-spacing:1px;text-align:center;">PREVIEW</div>
      </div>
      <div class="cust-options">
        <div class="cust-section">
          <label>FORMĂ PERSONAJ</label>
          <div class="shape-grid" id="shape-grid"></div>
        </div>
        <div class="cust-section">
          <label>CULOARE PRINCIPALĂ</label>
          <div class="color-grid" id="color-grid"></div>
        </div>
        <div class="cust-section">
          <label>STIL / SKIN</label>
          <div class="skin-grid" id="skin-grid"></div>
        </div>
      </div>
    </div>
    <div class="cust-footer">
      <button class="menu-btn secondary" onclick="backToMenu()">ÎNAPOI</button>
      <button class="btn-confirm" onclick="startGame()">INTRĂ ÎN LUPTĂ →</button>
    </div>
  </div>
</div>

<!-- ── SHOP SCREEN ── -->
<div id="shop" class="screen">
  <div class="shop-layout">
    <div class="shop-header">
      <h2>ARMURĂRIE</h2>
      <div class="money-display"><span>$</span><span id="shop-money">0</span></div>
    </div>
    <div class="shop-tabs">
      <button class="shop-tab active" onclick="setShopTab('weapons')">ARME</button>
      <button class="shop-tab" onclick="setShopTab('armor')">ARMURĂ</button>
      <button class="shop-tab" onclick="setShopTab('utility')">UTILITĂȚI</button>
    </div>
    <div class="shop-items" id="shop-items"></div>
    <div class="shop-footer">
      <span class="hint">Tap pe item pentru cumpărare / echipare</span>
      <button class="menu-btn secondary" onclick="closeShop()" style="padding:8px 20px;font-size:11px;">ÎNAPOI</button>
    </div>
  </div>
</div>

<!-- ── HUD ── -->
<div id="hud" style="display:none;">
  <div id="top-bar">
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="hud-money">$<span id="hud-money">0</span></div>
      <button id="shop-btn" onclick="openShop('game')">🛒</button>
    </div>
    <div class="hud-wave">WAVE <b id="hud-wave">1</b></div>
    <div class="hud-score">SCOR <b id="hud-score">0</b></div>
  </div>
  <div id="bar-area">
    <div class="bar-row">
      <div class="bar-label">HP</div>
      <div class="bar-track"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
      <div id="hp-txt">100</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">ARMOR</div>
      <div class="bar-track"><div class="bar-fill" id="armor-fill" style="width:0%"></div></div>
      <div id="armor-txt">0</div>
    </div>
  </div>
  <div id="util-bar"></div>
  <div id="weapon-hud">
    <div id="weapon-name">PISTOL</div>
    <div id="ammo-display">12 / 12</div>
    <div id="ammo-reserve">∞ rezervă</div>
    <div id="reload-bar-wrap">
      <div id="reload-bar-bg"><div id="reload-bar-fill"></div></div>
      <div id="reload-label">RELOAD...</div>
    </div>
    <button id="switch-btn" onclick="switchWeapon()" style="margin-top:6px;background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.3);color:#00d4ff;font-family:inherit;font-size:9px;letter-spacing:2px;padding:5px 10px;border-radius:4px;cursor:pointer;pointer-events:all;width:100%;">⇄ SWITCH (Q)</button>
    <div id="owned-weapons" style="margin-top:4px;display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap;"></div>
  </div>

  <div id="active-effects"></div>
  <div id="feed"></div>
  <div id="wave-banner"><h2 id="wave-banner-txt"></h2><p id="wave-banner-sub"></p></div>
  <div id="hit-marker"></div>
  <div id="dmg-flash"></div>
</div>

<!-- Between waves -->
<div id="between-screen">
  <h2 id="bw-title">WAVE COMPLETAT!</h2>
  <div class="sub" id="bw-sub">Inamici eliminați</div>
  <div class="earned" id="bw-earned">+$0 câștigați</div>
  <div style="display:flex;gap:12px;margin-top:8px;">
    <button class="bw-btn" id="bw-shop" onclick="openShop()">🛒 SHOP</button>
    <button class="bw-btn" id="bw-continue" onclick="continueWave()">NEXT WAVE →</button>
  </div>
</div>

<!-- Mobile controls -->
<div id="ctrl-left" style="display:none;">
  <div id="joy-base"><div id="joy-knob"></div></div>
</div>
<!-- Butoane mobile individuale, pozitii fixe -->
<div id="btn-shoot" style="display:none;">🔫</div>
<div id="btn-reload" style="display:none;" onclick="manualReload()">↺</div>

// ── MENU BACKGROUND ANIMATION ─────────────────────────────
const mbc = document.getElementById('menu-bg-canvas');
const mbctx = mbc.getContext('2d');
let mbW, mbH;
function resizeMB(){ mbW=mbc.width=window.innerWidth; mbH=mbc.height=window.innerHeight; }
resizeMB(); window.addEventListener('resize',resizeMB);

const mbParticles = Array.from({length:40},()=>({
  x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight,
  vx:(Math.random()-.5)*.6, vy:(Math.random()-.5)*.6,
  r:Math.random()*2.5+.5, alpha:Math.random()*.6+.2,
  color:['#00d4ff','#ff2244','#00cc66','#ffcc00'][Math.floor(Math.random()*4)]
}));

function animateMenuBg(){
  if(!document.getElementById('menu').classList.contains('active')) return;
  mbctx.fillStyle='rgba(8,12,16,.18)'; mbctx.fillRect(0,0,mbW,mbH);
  for(const p of mbParticles){
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=mbW; if(p.x>mbW)p.x=0;
    if(p.y<0)p.y=mbH; if(p.y>mbH)p.y=0;
    mbctx.save(); mbctx.globalAlpha=p.alpha;
    mbctx.fillStyle=p.color; mbctx.shadowColor=p.color; mbctx.shadowBlur=8;
    mbctx.beginPath(); mbctx.arc(p.x,p.y,p.r,0,Math.PI*2); mbctx.fill();
    mbctx.restore();
  }
  requestAnimationFrame(animateMenuBg);
}

function drawPreview(){
  const pc=document.getElementById('preview-canvas');
  const pctx=pc.getContext('2d');
  pctx.clearRect(0,0,100,120);
  // Background
  pctx.fillStyle='#0f1620'; pctx.fillRect(0,0,100,120);
  // Grid
  pctx.strokeStyle='rgba(255,255,255,.05)'; pctx.lineWidth=1;
  for(let i=0;i<100;i+=20){ pctx.beginPath();pctx.moveTo(i,0);pctx.lineTo(i,120);pctx.stroke(); }
  for(let j=0;j<120;j+=20){ pctx.beginPath();pctx.moveTo(0,j);pctx.lineTo(100,j);pctx.stroke(); }
  // Glow
  const skin=SKINS.find(s=>s.id===G.skin);
  if(skin.glow){
    pctx.save(); pctx.shadowColor=G.color; pctx.shadowBlur=20;
    drawShape(pctx,50,60,20,G.color);
    pctx.restore();
  }
  // Outline
  pctx.save();
  pctx.strokeStyle=skin.outline; pctx.lineWidth=2;
  drawShapeStroke(pctx,50,60,22);
  pctx.restore();
  // Shape
  drawShape(pctx,50,60,18,G.color);
  // Eye / barrel direction indicator
  pctx.fillStyle='rgba(255,255,255,.8)';
  pctx.beginPath(); pctx.arc(50,48,3,0,Math.PI*2); pctx.fill();
  // Name
  pctx.fillStyle='rgba(255,255,255,.7)'; pctx.font='8px Courier New'; pctx.textAlign='center';
  pctx.fillText(document.getElementById('char-name').value||'STRIKER',50,108);
}
document.addEventListener('input',e=>{ if(e.target.id==='char-name'){G.charName=e.target.value;drawPreview();}});

function drawShape(c,x,y,r,col){ SHAPES.find(s=>s.id===G.shape).draw(c,x,y,r,col); }
function drawShapeStroke(c,x,y,r){
  const s=SHAPES.find(sh=>sh.id===G.shape);
  c.beginPath();
  if(G.shape==='circle') c.arc(x,y,r,0,Math.PI*2);
  else if(G.shape==='square') c.rect(x-r,y-r,r*2,r*2);
  else if(G.shape==='triangle'){c.moveTo(x,y-r);c.lineTo(x+r,y+r);c.lineTo(x-r,y+r);c.closePath();}
  else if(G.shape==='diamond'){c.moveTo(x,y-r);c.lineTo(x+r,y);c.lineTo(x,y+r);c.lineTo(x-r,y);c.closePath();}
  else if(G.shape==='hex'){for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();}
  else{c.arc(x,y,r,0,Math.PI*2);}
  c.stroke();
}

  } else if(shopFrom==='between'){

}
function setShopTab(tab){
  G.shopTab=tab;
  document.querySelectorAll('.shop-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.shop-tab')[['weapons','armor','utility'].indexOf(tab)].classList.add('active');
  renderShopItems(tab);
}

function renderShopItems(tab){
  const container=document.getElementById('shop-items');
  container.innerHTML='';
  let items=[];
  if(tab==='weapons') items=WEAPONS;
  else if(tab==='armor') items=ARMORS;
  else items=UTILITIES;

  items.forEach(item=>{
    const div=document.createElement('div');
    const isOwned=item.owned===true||item.owned>0;
    const isEquipped=(tab==='weapons'&&G.equippedWeapon===item.id)||(tab==='armor'&&G.equippedArmor===item.id);
    const cantAfford=item.price>G.money&&!isOwned;
    div.className='shop-item'+(isEquipped?' equipped':isOwned?' owned':cantAfford?' cant-afford':'');

    let badgeHtml='';
    if(isEquipped) badgeHtml='<span class="item-badge badge-equipped">ECHIPAT</span>';
    else if(tab==='utility'&&item.owned>0) badgeHtml=`<span class="item-badge badge-owned">×${item.owned}</span>`;
    else if(isOwned) badgeHtml='<span class="item-badge badge-owned">DEȚINUT</span>';

    let statsHtml=Object.entries(item.stats||{}).map(([k,v])=>`<div class="item-stat"><span class="label">${k}</span><span class="val">${v}</span></div>`).join('');

    div.innerHTML=`
      <div class="item-icon">${item.icon}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-desc">${item.desc}</div>
      <div class="item-stats">${statsHtml}</div>
      <div class="item-price ${item.price===0?'free':''}">${item.price===0?'GRATIS':'$'+item.price}</div>
      ${badgeHtml}
    `;
    div.onclick=()=>buyOrEquip(tab,item);
    container.appendChild(div);
  });
}

function buyOrEquip(tab,item){
  if(tab==='weapons'){
    if(!item.owned){
      if(G.money<item.price){addFeed('Nu ai suficienți bani!','#ff2244');return;}
      G.money-=item.price; item.owned=true;
    }
    G.equippedWeapon=item.id;
    G.ammo=item.mag; G.reserveAmmo=item.mag*4;
    addFeed('Echipat: '+item.name,'#00d4ff');
  } else if(tab==='armor'){
    if(!item.owned){
      if(G.money<item.price){addFeed('Nu ai suficienți bani!','#ff2244');return;}
      G.money-=item.price; item.owned=true;
    }
    G.equippedArmor=item.id;
    G.maxArmor=item.armor; G.armor=item.armor;
    G.armorAbsorb=item.id==='vest_light'?.4:item.id==='vest_medium'?.55:.7;
    addFeed('Armor echipat: '+item.name,'#2288ff');
  } else {
    if(item.owned>=item.maxOwn){addFeed('Maxim '+item.maxOwn+' la slot!','#ff6b00');return;}
    if(G.money<item.price){addFeed('Nu ai suficienți bani!','#ff2244');return;}
    G.money-=item.price; item.owned++;
    updateUtilBar();
    addFeed('Cumpărat: '+item.name,'#00cc66');
  }
  document.getElementById('shop-money').textContent=G.money;
  renderShopItems(tab);
  updateHUD();
}

function updateUtilBar(){
  const bar=document.getElementById('util-bar');
  bar.innerHTML='';
  UTILITIES.filter(u=>u.owned>0).forEach((u,i)=>{
    const el=document.createElement('div');
    el.className='util-slot';
    el.dataset.uid=u.id;
    el.innerHTML=`<div class="u-icon">${u.icon}</div><div class="u-count">×${u.owned}</div><div class="u-cd" id="cd-${u.id}"></div>`;
    el.onclick=()=>{ G.selectedUtil=u.id; useUtil(); };
    bar.appendChild(el);
  });
  document.getElementById('btn-util').textContent=UTILITIES.find(u=>u.owned>0)?.icon||'🎒';
}

// Joystick
const jZone=document.getElementById('ctrl-left');
const jBase=document.getElementById('joy-base');
const jKnob=document.getElementById('joy-knob');
const JR=40;
jZone.addEventListener('touchstart',e=>{e.preventDefault();if(joy.active)return;const t=e.changedTouches[0];const r=jZone.getBoundingClientRect();joy={active:true,id:t.identifier,sx:t.clientX-r.left,sy:t.clientY-r.top,dx:0,dy:0};jBase.style.left=(joy.sx-53)+'px';jBase.style.bottom=(r.height-joy.sy-53)+'px';jBase.style.top='unset';},{passive:false});
jZone.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier!==joy.id)continue;const r=jZone.getBoundingClientRect();let dx=t.clientX-r.left-joy.sx,dy=t.clientY-r.top-joy.sy;const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}joy.dx=dx/JR;joy.dy=dy/JR;jKnob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;}},{passive:false});
function endJoy(e){for(const t of e.changedTouches){if(t.identifier===joy.id){joy={active:false,id:null,sx:0,sy:0,dx:0,dy:0};jKnob.style.transform='translate(-50%,-50%)';}}}
jZone.addEventListener('touchend',endJoy,{passive:false});
jZone.addEventListener('touchcancel',endJoy,{passive:false});

const bShoot=document.getElementById('btn-shoot');

  const pistol=WEAPONS.find(w=>w.id==='pistol');
  G.ammo=pistol.mag; G.reserveAmmo=pistol.mag*4;
  G.reloading=false;
  G.x=W/2; G.y=H/2; G.angle=0; G.vx=0; G.vy=0;
  G.selectedUtil=null;
  enemies=[]; bullets=[]; particles=[]; grenadeExplosions=[];

  showScreen(null);
  document.getElementById('hud').style.display='block';
  document.getElementById('between-screen').style.display='none';
  // Arată controale mobile
  const mobileEls=['ctrl-left','btn-shoot','btn-reload','btn-switch','btn-util'];
  mobileEls.forEach(id=>document.getElementById(id).style.display='flex');

  updateHUD(); updateUtilBar();
  running=true; lastT=performance.now();
  spawnWave(1);
  requestAnimationFrame(loop);
}

// ── WAVE SYSTEM ───────────────────────────────────────────
function spawnWave(w){
  waveActive=true;
  const count=3+w*2+(w>3?w:0);
  waveEnemiesLeft=count;
  enemies=[];
  const types=['grunt','fast','heavy','sniper'];
  for(let i=0;i<count;i++){
    let type='grunt';
    if(w>=2&&Math.random()<.2) type='fast';
    if(w>=3&&Math.random()<.18) type='heavy';
    if(w>=4&&Math.random()<.12) type='sniper';
    setTimeout(()=>spawnEnemy(type,w), i*420);
  }
  showWaveBanner('WAVE '+w, count+' INAMICI');
  document.getElementById('hud-wave').textContent=w;
}

function spawnEnemy(type,wave){
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=Math.random()*W;y=-30;}
  else if(side===1){x=W+30;y=Math.random()*H;}
  else if(side===2){x=Math.random()*W;y=H+30;}
  else{x=-30;y=Math.random()*H;}

  const configs={
    grunt:{hp:40+wave*8,   spd:1.4+wave*.08,  dmg:8,  reward:10,  color:'#ff2244', size:14, shape:'circle'},
    fast: {hp:25+wave*5,   spd:2.6+wave*.12,  dmg:6,  reward:15,  color:'#ff8800', size:11, shape:'triangle'},
    heavy:{hp:120+wave*20, spd:0.85+wave*.04, dmg:18, reward:35,  color:'#aa0000', size:22, shape:'square'},
    sniper:{hp:35+wave*6,  spd:1.1+wave*.05,  dmg:30, reward:25,  color:'#aa44ff', size:12, shape:'diamond'},
  };
  const cfg=configs[type];
  enemies.push({x,y,type,hp:cfg.hp,maxHp:cfg.hp,spd:cfg.spd,dmg:cfg.dmg,reward:cfg.reward,
    color:cfg.color,size:cfg.size,shape:cfg.shape,angle:0,
    flashTimer:0, shootTimer:0, shootCd:type==='sniper'?180:0,
    alive:true});
}

function checkWaveComplete(){
  if(!waveActive) return;
  if(enemies.filter(e=>e.alive).length===0&&waveEnemiesLeft<=0){
    waveActive=false;
    const reward=50+G.wave*30;
    G.money+=reward; G.waveEarned=reward;
    G.score+=reward;
    G.wave++;
    setTimeout(()=>showBetweenWave(reward), 800);
  }
}

function showBetweenWave(earned){
  if(!running) return;
  running=false;
  const bw=document.getElementById('between-screen');
  bw.style.display='flex';
  document.getElementById('bw-title').textContent='WAVE COMPLETAT!';
  document.getElementById('bw-sub').textContent=`${G.kills} inamici eliminați`;
  document.getElementById('bw-earned').textContent=`+$${earned} câștigați`;
  // reset buttons to normal state
  document.getElementById('bw-shop').style.display='';
  document.getElementById('bw-shop').onclick=()=>openShop('between');
  const cont=document.getElementById('bw-continue');
  cont.textContent='NEXT WAVE →';
  cont.onclick=null;
  cont.onclick=continueWave;
  updateHUD();
}

function continueWave(){
  document.getElementById('between-screen').style.display='none';
  G.hp=Math.min(G.maxHp, G.hp+20);
  running=true; lastT=performance.now();
  spawnWave(G.wave);
  requestAnimationFrame(loop);
}

// ── PLAYER UPDATE ─────────────────────────────────────────
function updatePlayer(dt){
  const s=dt/1000;
  let spd=200*(G.effects.speed>Date.now()?1.8:1);

  let dx=0, dy=0;
  if(keys['KeyW']||keys['ArrowUp'])    dy=-1;
  if(keys['KeyS']||keys['ArrowDown'])  dy=1;
  if(keys['KeyA']||keys['ArrowLeft'])  dx=-1;
  if(keys['KeyD']||keys['ArrowRight']) dx=1;
  if(joy.active){ dx=joy.dx; dy=joy.dy; }

  const mag=Math.sqrt(dx*dx+dy*dy);
  if(mag>0){dx/=mag;dy/=mag;}
  G.x=Math.max(16,Math.min(W-16,G.x+dx*spd*s));
  G.y=Math.max(16,Math.min(H-16,G.y+dy*spd*s));

  // Aim — pe mobil: vizăm automat cel mai apropiat inamic, sau păstrăm ultimul unghi
  const isMobile='ontouchstart' in window;
  if(isMobile){
    // Auto-aim spre cel mai apropiat inamic vizibil
    const alive=enemies.filter(e=>e.alive);
    if(alive.length>0){
      const nearest=alive.reduce((a,b)=>{
        const da=(a.x-G.x)**2+(a.y-G.y)**2;
        const db=(b.x-G.x)**2+(b.y-G.y)**2;
        return da<db?a:b;
      });
      G.angle=Math.atan2(nearest.y-G.y, nearest.x-G.x);
    }
    // dacă nu sunt inamici, păstrăm ultimul unghi (nu resetăm)
  } else {
    // PC: aim spre mouse
    G.angle=Math.atan2(mouseY-G.y, mouseX-G.x);
  }

  // Reload progress
  if(G.reloading){
    const w=getWeapon();
    const prog=(Date.now()-G.reloadStart)/(w.reload*1000);
    document.getElementById('reload-bar-fill').style.width=Math.min(100,prog*100)+'%';
    if(prog>=1){
      G.reloading=false;
      if(w.infinite){
        G.ammo=w.mag; // pistol = refill complet gratuit
      } else {
        const need=w.mag-G.ammo;
        const take=Math.min(need,G.reserveAmmo);
        G.ammo+=take; G.reserveAmmo-=take;
      }
      document.getElementById('reload-bar-wrap').style.display='none';
      updateHUD();
    }
  }

  // Shoot
  if(shooting&&!G.reloading) tryShoot();
}

function tryShoot(){
  if(shootCooldown>0) return;
  if(G.ammo<=0){ autoReload(); return; }
  const w=getWeapon();
  const interval=1000/(w.rpm/60);
  shootCooldown=interval;

  G.ammo--;
  updateHUD();

  // Muzzle flash particle
  spawnParticle(G.x+Math.cos(G.angle)*20,G.y+Math.sin(G.angle)*20,'#ffcc00',4,2,true);

  // Pellets
  for(let p=0;p<w.pellets;p++){
    const spread=(Math.random()-.5)*w.spread+(Math.random()-.5)*w.spread;
    const a=G.angle+spread;
    bullets.push({
      x:G.x+Math.cos(G.angle)*22,
      y:G.y+Math.sin(G.angle)*22,
      vx:Math.cos(a)*520, vy:Math.sin(a)*520,
      dmg:w.dmg, range:w.range, dist:0,
      owner:'player', alive:true, r:w.pellets>1?3:4,
    });
  }
}

function autoReload(){
  if(G.reloading) return;
  const w=getWeapon();
  if(G.ammo>=w.mag) return;
  if(!w.infinite && G.reserveAmmo<=0 && G.ammo===0){
    addFeed('Fără muniție! Schimbă arma (Q)','#ff2244');
    return;
  }
  startReload();
}

function manualReload(){
  const w=getWeapon();
  if(G.reloading) return;
  if(G.ammo>=w.mag){ addFeed('Magazie plină!','#4488cc'); return; }
  if(!w.infinite && G.reserveAmmo<=0){ addFeed('Fără rezervă! Schimbă arma (Q)','#ff2244'); return; }
  startReload();
  addFeed('↺ Reload manual','#4488cc');
}

function startReload(){
  G.reloading=true; G.reloadStart=Date.now();
  document.getElementById('reload-bar-wrap').style.display='block';
  document.getElementById('reload-bar-fill').style.width='0%';
}

// ── UTILITY ───────────────────────────────────────────────
function useUtil(){
  const avail=UTILITIES.filter(u=>u.owned>0);
  if(avail.length===0){addFeed('Nicio utilitate!','#ff6b00');return;}
  // Use first available (or selected)
  const uid=G.selectedUtil||avail[0].id;
  const util=UTILITIES.find(u=>u.id===uid)||avail[0];
  if(util.owned<=0){addFeed('Epuizat!','#ff2244');return;}

  util.owned--;
  updateUtilBar();

  if(util.effect==='heal'){
    G.hp=Math.min(G.maxHp,G.hp+util.value);
    addFeed('💊 +'+util.value+' HP restaurat','#00cc66');
    spawnParticle(G.x,G.y,'#00cc66',12,4);
  } else if(util.effect==='speed'){
    G.effects.speed=Date.now()+util.duration;
    addFeed('⚡ SPEED BOOST activ ('+util.duration/1000+'s)','#ffcc00');
    addEffect('⚡ SPEED',util.duration,'#ffcc00');
  } else if(util.effect==='invuln'){
    G.effects.invuln=Date.now()+util.duration;
    addFeed('🔮 CÂMP DE FORȚĂ activ ('+util.duration/1000+'s)','#aa44ff');
    addEffect('🔮 INVULN',util.duration,'#aa44ff');
  } else if(util.effect==='ammo'){
    const w=getWeapon();
    G.ammo=w.mag; G.reserveAmmo=w.mag*4;
    addFeed('📦 Muniție reîncărcată complet!','#00d4ff');
    updateHUD();
  } else if(util.effect==='grenade'){
    // spawn grenade in direction player faces
    const gx=G.x+Math.cos(G.angle)*90;
    const gy=G.y+Math.sin(G.angle)*90;
    grenadeExplosions.push({x:gx,y:gy,r:0,maxR:90,dmg:80,timer:8});
    spawnParticle(gx,gy,'#ff8800',20,6);
    addFeed('💣 GRENADĂ!','#ff8800');
  }
  updateHUD();
}

function addEffect(label,dur,col){
  const ef=document.getElementById('active-effects');
  const el=document.createElement('div');
  el.className='effect-badge';
  el.style.background=col+'22'; el.style.border='1px solid '+col+'55';
  el.innerHTML=`<span style="color:${col}">${label}</span><span class="effect-timer" id="eft-${label.replace(/\s/g,'')}"></span>`;
  ef.appendChild(el);
  const end=Date.now()+dur;
  const iv=setInterval(()=>{
    const rem=Math.max(0,Math.ceil((end-Date.now())/1000));
    const span=document.getElementById('eft-'+label.replace(/\s/g,''));
    if(span) span.textContent=rem+'s';
    if(rem<=0){clearInterval(iv);el.remove();}
  },200);
}

// ── ENEMY UPDATE ──────────────────────────────────────────
function updateEnemies(dt){
  const s=dt/1000;
  for(const e of enemies){
    if(!e.alive) continue;
    const dx=G.x-e.x, dy=G.y-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    e.angle=Math.atan2(dy,dx);

    // Move toward player
    if(dist>e.size+16){
      e.x+=dx/dist*e.spd*(60*s);
      e.y+=dy/dist*e.spd*(60*s);
    }

    if(e.flashTimer>0) e.flashTimer--;

    // Attack player (melee)
    if(dist<e.size+18){
      if(G.effects.invuln<Date.now()){ // not invulnerable
        const rawDmg=e.dmg*s*2;
        applyDamage(rawDmg);
      }
    }

    // Sniper shoots
    if(e.type==='sniper'){
      e.shootTimer++;
      if(e.shootTimer>=e.shootCd){
        e.shootTimer=0;
        if(dist<350){
          const a=Math.atan2(G.y-e.y,G.x-e.x)+(Math.random()-.5)*.08;
          bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*440,vy:Math.sin(a)*440,dmg:e.dmg,range:380,dist:0,owner:'enemy',alive:true,r:4,color:'#aa44ff'});
        }
      }
    }
  }
}

function applyDamage(dmg){
  let remaining=dmg;
  if(G.armor>0){
    const absorbed=dmg*G.armorAbsorb;
    G.armor=Math.max(0,G.armor-absorbed);
    remaining=dmg*(1-G.armorAbsorb);
  }
  G.hp=Math.max(0,G.hp-remaining);
  document.getElementById('dmg-flash').style.background='rgba(255,20,60,.3)';
  setTimeout(()=>document.getElementById('dmg-flash').style.background='rgba(255,20,60,0)',120);
  if(G.hp<=0) gameOver();
  updateHUD();
}

// ── BULLET UPDATE ─────────────────────────────────────────
function updateBullets(dt){
  const s=dt/1000;
  for(const b of bullets){
    if(!b.alive) continue;
    b.x+=b.vx*s; b.y+=b.vy*s;
    b.dist+=Math.sqrt(b.vx*b.vx+b.vy*b.vy)*s;
    if(b.dist>b.range||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){b.alive=false;continue;}

    if(b.owner==='player'){
      for(const e of enemies){
        if(!e.alive) continue;
        const dx=b.x-e.x,dy=b.y-e.y;
        if(dx*dx+dy*dy<(e.size+b.r)**2){
          b.alive=false;
          e.hp-=b.dmg; e.flashTimer=6;
          spawnParticle(b.x,b.y,'#ffcc00',5,3);
          showHitMarker();
          if(e.hp<=0){ killEnemy(e); }
          break;
        }
      }
    } else {
      // enemy bullet hits player
      const dx=b.x-G.x,dy=b.y-G.y;
      if(dx*dx+dy*dy<(16+b.r)**2){
        b.alive=false;
        if(G.effects.invuln<Date.now()) applyDamage(b.dmg*1.2);
      }
    }
  }
  bullets=bullets.filter(b=>b.alive);

  // Grenade explosions
  for(const g of grenadeExplosions){
    g.timer--;
    g.r=g.maxR*(1-g.timer/8);
    if(g.timer<=0) continue;
    for(const e of enemies){
      if(!e.alive) continue;
      const dx=e.x-g.x,dy=e.y-g.y;
      if(dx*dx+dy*dy<(g.r+e.size)**2){
        e.hp-=g.dmg*(1/8);
        e.flashTimer=4;
        if(e.hp<=0) killEnemy(e);
      }
    }
  }
  grenadeExplosions=grenadeExplosions.filter(g=>g.timer>0);
}

function killEnemy(e){
  e.alive=false;
  G.money+=e.reward; G.score+=e.reward; G.kills++;
  waveEnemiesLeft--;
  spawnParticle(e.x,e.y,e.color,14,5);
  addFeed('✓ KILL +$'+e.reward,'#00cc66');
  updateHUD();
  checkWaveComplete();
}

// ── PARTICLES ─────────────────────────────────────────────
function spawnParticle(x,y,color,count=8,speed=3,small=false){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const spd=Math.random()*speed+1;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:Math.random()*.06+.03,size:small?Math.random()*2+1:Math.random()*4+2,color});
  }
}

function switchWeapon(){
  const owned=WEAPONS.filter(w=>w.owned===true);
  if(owned.length<=1){ addFeed('Ai o singură armă! Cumpără din shop.','#ff6b00'); return; }
  const curIdx=owned.findIndex(w=>w.id===G.equippedWeapon);
  const next=owned[(curIdx+1)%owned.length];
  G.equippedWeapon=next.id;
  G.reloading=false;
  document.getElementById('reload-bar-wrap').style.display='none';
  // restore ammo for switched weapon (track per-weapon)
  if(!G.weaponAmmo) G.weaponAmmo={};
  G.weaponAmmo[owned[curIdx].id]=G.ammo; // save current
  G.ammo = G.weaponAmmo[next.id]!==undefined ? G.weaponAmmo[next.id] : next.mag;
  if(!G.weaponReserve) G.weaponReserve={};
  G.weaponReserve[owned[curIdx].id]=G.reserveAmmo;
  G.reserveAmmo = G.weaponReserve[next.id]!==undefined ? G.weaponReserve[next.id] : next.mag*4;
  addFeed('⇄ '+next.name+' echipat','#00d4ff');
  updateHUD();
}

function updateHUD(){
  document.getElementById('hud-money').textContent=G.money;
  document.getElementById('hud-score').textContent=G.score;
  document.getElementById('hp-fill').style.width=(G.hp/G.maxHp*100)+'%';
  document.getElementById('hp-txt').textContent=Math.ceil(G.hp);
  document.getElementById('armor-fill').style.width=(G.maxArmor>0?G.armor/G.maxArmor*100:0)+'%';
  document.getElementById('armor-txt').textContent=Math.ceil(G.armor);
  const w=getWeapon();
  document.getElementById('weapon-name').textContent=w.name+(w.infinite?' ∞':'');
  document.getElementById('ammo-display').textContent=G.ammo+' / '+w.mag;
  document.getElementById('ammo-reserve').textContent=w.infinite?'∞ rezervă':(G.reserveAmmo+' rezervă');
  // Owned weapons strip
  const strip=document.getElementById('owned-weapons');
  if(strip){
    strip.innerHTML='';
    WEAPONS.filter(ww=>ww.owned===true).forEach(ww=>{
      const el=document.createElement('div');
      el.style.cssText=`font-size:9px;padding:2px 6px;border-radius:3px;border:1px solid ${ww.id===G.equippedWeapon?'#00d4ff':'rgba(255,255,255,.15)'};color:${ww.id===G.equippedWeapon?'#00d4ff':'#666'};background:${ww.id===G.equippedWeapon?'rgba(0,212,255,.1)':'transparent'};cursor:pointer;`;
      el.textContent=ww.icon+' '+ww.name;
      el.onclick=()=>{ G.equippedWeapon=ww.id; G.reloading=false; document.getElementById('reload-bar-wrap').style.display='none'; G.ammo=(G.weaponAmmo&&G.weaponAmmo[ww.id]!==undefined)?G.weaponAmmo[ww.id]:ww.mag; G.reserveAmmo=(G.weaponReserve&&G.weaponReserve[ww.id]!==undefined)?G.weaponReserve[ww.id]:ww.mag*4; addFeed('⇄ '+ww.name,'#00d4ff'); updateHUD(); };
      strip.appendChild(el);
    });
  }
}

// ── RENDER ────────────────────────────────────────────────
function render(){
  // Background
  ctx.fillStyle='#080c10'; ctx.fillRect(0,0,W,H);
  // Grid — fixed, nu se mișcă cu playerul
  ctx.strokeStyle='rgba(30,48,80,.4)'; ctx.lineWidth=1;
  const gs=60;
  for(let x=0;x<W;x+=gs){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
  for(let y=0;y<H;y+=gs){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }

  // Grenade explosions
  for(const g of grenadeExplosions){
    ctx.save();
    const gr=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,g.r);
    gr.addColorStop(0,'rgba(255,180,50,.45)'); gr.addColorStop(1,'rgba(255,80,0,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Particles
  for(const p of particles){
    ctx.save(); ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    ctx.restore();
    p.x+=p.vx; p.y+=p.vy; p.vx*=.90; p.vy*=.90; p.life-=p.decay;
  }
  particles=particles.filter(p=>p.life>0);

  // Enemies
  for(const e of enemies){
    if(!e.alive) continue;
    ctx.save();
    const isFlash=e.flashTimer>0;
    ctx.shadowColor=e.color; ctx.shadowBlur=isFlash?20:10;
    // Shape
    const shp=SHAPES.find(s=>s.id===e.shape)||SHAPES[0];
    shp.draw(ctx,e.x,e.y,e.size,isFlash?'#ffffff':e.color);
    // HP bar (if damaged)
    if(e.hp<e.maxHp){
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(e.x-e.size,e.y+e.size+4,e.size*2,4);
      ctx.fillStyle=e.hp/e.maxHp>.5?'#00cc66':'#ff2244';
      ctx.fillRect(e.x-e.size,e.y+e.size+4,e.size*2*(e.hp/e.maxHp),4);
    }
    ctx.restore();
  }

  // Bullets
  for(const b of bullets){
    ctx.save(); ctx.shadowColor=b.owner==='player'?'#ffcc00':'#aa44ff'; ctx.shadowBlur=8;
    ctx.fillStyle=b.color||(b.owner==='player'?'#ffee44':'#dd44ff');
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Player
  ctx.save();
  const invuln=G.effects.invuln>Date.now();
  const spd=G.effects.speed>Date.now();
  ctx.shadowColor=invuln?'#aa44ff':spd?'#ffcc00':G.color; ctx.shadowBlur=invuln?28:spd?18:14;
  if(invuln){ ctx.strokeStyle='rgba(170,68,255,.6)'; ctx.lineWidth=3; }

  // Skin outline
  const skin=SKINS.find(s=>s.id===G.skin);
  ctx.strokeStyle=skin.outline; ctx.lineWidth=2.5;
  drawPlayerShape(ctx,G.x,G.y,16);
  ctx.stroke();
  ctx.globalAlpha=invuln?.65:1;
  drawShape(ctx,G.x,G.y,14,G.color);
  ctx.restore();

  // Gun barrel
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(G.x+Math.cos(G.angle)*12,G.y+Math.sin(G.angle)*12);
  ctx.lineTo(G.x+Math.cos(G.angle)*28,G.y+Math.sin(G.angle)*28);
  ctx.stroke(); ctx.restore();

  // Crosshair (desktop)
  if(!('ontouchstart' in window)){
    ctx.save(); ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1;
    const cx=mouseX,cy=mouseY;
    ctx.beginPath();ctx.moveTo(cx-8,cy);ctx.lineTo(cx+8,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,cy-8);ctx.lineTo(cx,cy+8);ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }

  // Shoot cooldown timer in HUD
  if(shootCooldown>0) shootCooldown=Math.max(0,shootCooldown-16);
}

function drawPlayerShape(c,x,y,r){
  const s=SHAPES.find(sh=>sh.id===G.shape);
  c.beginPath();
  if(G.shape==='circle') c.arc(x,y,r,0,Math.PI*2);
  else if(G.shape==='square') c.rect(x-r,y-r,r*2,r*2);
  else if(G.shape==='triangle'){c.moveTo(x,y-r);c.lineTo(x+r,y+r);c.lineTo(x-r,y+r);c.closePath();}
  else if(G.shape==='diamond'){c.moveTo(x,y-r);c.lineTo(x+r,y);c.lineTo(x,y+r);c.lineTo(x-r,y);c.closePath();}
  else if(G.shape==='hex'){for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();}
  else c.arc(x,y,r,0,Math.PI*2);
}

// ── MAIN LOOP ─────────────────────────────────────────────
function loop(now){
  if(!running) return;
  const dt=Math.min(50,now-lastT); lastT=now;
  totalMs+=dt;
  updatePlayer(dt);
  updateEnemies(dt);
  updateBullets(dt);
  render();
  requestAnimationFrame(loop);
}
</script>
